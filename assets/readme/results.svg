<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Results of the main model</title>
  <desc id="desc">Main model, no leaderboard tuning: public score 0.3178, out-of-fold RMSE 0.500, out-of-fold Pearson r 0.915. Chart of the public score across versions, from 0.3463 to 0.3178; the biggest steps came from test-length crops, removing a measured test bias, an audio language model and a fine-tuned text model. Lower is better.</desc>
  <rect x="1" y="1" width="1198" height="608" rx="24" fill="#FBFAF7" stroke="#E6E2D9" stroke-width="2"/>
  <g transform="translate(48 48)">
      <rect width="336" height="150" rx="16" fill="#FFFFFF" stroke="#E6E2D9" stroke-width="2"/>
      <text x="28" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#C2410C">0.3178</text>
      <text x="28" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#14171C">public score, main model</text>
      <text x="28" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#6B6F76">no leaderboard tuning</text>
    </g>
  <g transform="translate(432 48)">
      <rect width="336" height="150" rx="16" fill="#FFFFFF" stroke="#E6E2D9" stroke-width="2"/>
      <text x="28" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#14171C">0.500</text>
      <text x="28" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#14171C">out-of-fold RMSE</text>
      <text x="28" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#6B6F76">speaker-grouped, test-length crops</text>
    </g>
  <g transform="translate(816 48)">
      <rect width="336" height="150" rx="16" fill="#FFFFFF" stroke="#E6E2D9" stroke-width="2"/>
      <text x="28" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#14171C">0.915</text>
      <text x="28" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#14171C">out-of-fold Pearson r</text>
      <text x="28" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#6B6F76">769 labelled clips</text>
    </g>
