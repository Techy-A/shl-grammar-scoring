<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Spoken Grammar Scoring</title>
  <desc id="desc">SHL Hiring Assessment 2026. A model that listens to 45 to 60 seconds of spontaneous spoken English and predicts the 0 to 5 grammar score a human rater would give. A plain speech recogniser writes "so he doesn't like it"; with a verbatim prompt the transcript keeps the spoken error "so he don't like it".</desc>
  <rect x="1" y="1" width="1198" height="418" rx="24" fill="#FBFAF7" stroke="#E6E2D9" stroke-width="2"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#C2410C">SHL HIRING ASSESSMENT 2026</text>
    <text x="64" y="166" font-size="62" font-weight="700" fill="#14171C">Spoken Grammar</text>
    <text x="64" y="234" font-size="62" font-weight="700" fill="#14171C">Scoring</text>
    <text x="64" y="288" font-size="23" fill="#4A4F57">Listens to 45–60 s of spontaneous English</text>
    <text x="64" y="320" font-size="23" fill="#4A4F57">and predicts the 0–5 grammar score a rater gives.</text>
    <text x="64" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6B6F76">Whisper · DeBERTa-v3 · WavLM · Voxtral-Mini-3B</text>
  </g>

